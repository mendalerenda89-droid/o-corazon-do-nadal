<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex">
<title>Espíritu de la Navidad · O Corazón do Nadal</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ice:#7fd0ff;--gold:#E2B663;--txt:#eef4fb;--dim:#a9bfd9}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#040b1c;color:var(--txt);font-family:'Manrope',sans-serif;user-select:none}
body::before{content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 38%,rgba(127,208,255,.16),transparent 55%),
             radial-gradient(ellipse at 15% 0%,rgba(63,207,122,.10),transparent 50%),
             radial-gradient(ellipse at 85% 0%,rgba(127,208,255,.10),transparent 50%),
             radial-gradient(ellipse at 50% 120%,rgba(210,65,58,.14),transparent 60%)}
canvas{position:fixed;inset:0;width:100%;height:100%}
#top{position:fixed;top:4vh;left:0;right:0;text-align:center;pointer-events:none}
#top .k{font-size:11px;letter-spacing:5px;color:var(--gold);text-transform:uppercase}
#top .t{font-family:'Cinzel Decorative',serif;font-size:clamp(26px,5vw,44px);color:var(--gold);
  text-shadow:0 0 24px rgba(226,182,99,.35);margin-top:6px}
#center{position:fixed;left:50%;transform:translateX(-50%);bottom:6vh;width:min(860px,92vw);text-align:center;pointer-events:none}
#estado{font-family:'Cinzel',serif;letter-spacing:6px;font-size:13px;text-transform:uppercase;color:var(--ice);
  text-shadow:0 0 12px currentColor;margin-bottom:12px;transition:color .4s}
#pregunta{min-height:22px;font-style:italic;color:var(--dim);font-size:16px;margin-bottom:10px}
#resposta{min-height:70px;font-family:'Cinzel',serif;font-weight:600;font-size:clamp(19px,2.6vw,28px);line-height:1.4;
  color:#fff;text-shadow:0 0 18px rgba(127,208,255,.55)}
#resposta.in{animation:aparece 1.2s ease}
@keyframes aparece{from{opacity:0;filter:blur(6px);transform:translateY(8px)}to{opacity:1;filter:none;transform:none}}
  color:rgba(169,191,217,.25);font-size:20px;cursor:pointer}
#fb{position:fixed;left:12px;bottom:12px;font-size:10px;letter-spacing:2px;color:rgba(169,191,217,.45);text-transform:uppercase}
#fb i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:#E2B663;vertical-align:middle}
#fb.ok i{background:#3fcf7a}#fb.err i{background:#d2413a}
#boot{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:rgba(4,11,28,.94);text-align:center;padding:20px;cursor:pointer}
#boot .t{font-family:'Cinzel Decorative',serif;color:var(--gold);font-size:clamp(30px,6vw,52px)}
#boot .s{font-family:'Cinzel',serif;color:var(--dim);letter-spacing:3px}
#boot .btn{margin-top:10px;padding:16px 34px;border:1px solid var(--gold);border-radius:40px;color:var(--gold);
  font-family:'Cinzel',serif;letter-spacing:3px;animation:lat 2s ease-in-out infinite}
@keyframes lat{50%{box-shadow:0 0 30px rgba(226,182,99,.45)}}
#boot.gone{opacity:0;pointer-events:none;transition:opacity 1s}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top"><div class="k">O Corazón do Nadal</div><div class="t">Espíritu de la Navidad</div></div>
<div id="center">
  <div id="estado">Durmiendo</div>
  <div id="pregunta"></div>
  <div id="resposta">Tocad el espíritu y llamadlo por su nombre…</div>
</div>
<div id="fb"><i></i><span id="fb-l">Conectando</span></div>
<div id="boot">
  <div class="t">Espíritu de la Navidad</div>
  <div class="s">El misterio del Tesoro Helado</div>
  <div class="btn">✦ DESPERTAR AL ESPÍRITU ✦</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { crearEspirito, decidirPista, extraPista, entradaLog } from "./espirito-core.js";
// As pistas edítanse en espirito-core.js (común con jugador.html)

const SESION = "navidad_lugo";
const $ = id => document.getElementById(id);
let D = {}, db = null, ultima = "", booted = false;

function amosar(pregunta,resposta){
  if(pregunta!==null) $("pregunta").textContent = pregunta ? "« "+pregunta+" »" : "";
  if(resposta!==null){ const r=$("resposta"); r.classList.remove("in"); void r.offsetWidth; r.textContent=resposta; r.classList.add("in"); }
}
const esp = crearEspirito({
  canvas:$("cv"),
  onEstado:(txt,col)=>{ $("estado").textContent=txt; $("estado").style.color=col; },
  onParcial:t=>amosar(t,null)
});
esp.setEstado("durmindo");
esp.engadirAxustes();

function responder(texto){
  if(D.espirito_mudo){ esp.setEstado("esperto"); rexistrar(texto,"(espírito silenciado)","mudo"); return; }
  esp.setEstado("pensa");
  const d=decidirPista(texto,D,ultima);
  setTimeout(()=>{
    amosar(null,d.r); ultima=d.r; esp.falar(d.r);
    rexistrar(texto,d.r,d.tipo,d.fase,d.nivel,extraPista(d,D));
  },1100);
}
function rexistrar(p,r,tipo,fase,nivel,extra={}){
  const log=entradaLog(D,p,r,tipo,fase,nivel);
  D.espirito_log=log; Object.assign(D,extra);
  gardar({espirito_log:log,...extra});
}

async function gardar(data){ if(!db) return; try{ await setDoc(doc(db,"juego",SESION),data,{merge:true}); fb("ok"); }catch(e){ fb("err"); } }
function fb(st){ $("fb").className=st; $("fb-l").textContent= st==="ok"?"Sincronizado":st==="err"?"Sin conexión":"Conectando"; }
let ultimoCmd=0, primeiro=true;
function conectar(cfg){
  try{
    db=getFirestore(initializeApp(cfg));
    onSnapshot(doc(db,"juego",SESION),snap=>{
      fb("ok"); D=snap.exists()?snap.data():{};
      const c=D.espirito_cmd;
      if(c && c.ts>ultimoCmd){
        const novo=!primeiro; ultimoCmd=c.ts;
        if(novo && c.texto && booted){ amosar("",c.texto); ultima=c.texto; esp.falar(c.texto); }
      }
      primeiro=false;
    },()=>fb("err"));
  }catch(e){ fb("err"); }
}

$("boot").onclick=async()=>{
  booted=true; $("boot").classList.add("gone");
  try{ await document.documentElement.requestFullscreen(); }catch(e){}
  await esp.espertar();
  amosar("","Tocad el espíritu y llamadlo por su nombre…");
};
$("cv").addEventListener("click",()=>{ if(booted) esp.escoitar((t,erro)=>{ if(t) responder(t); else if(erro) amosar(null,erro); }); });

// para probar sen falar: na consola, espirito("Espírito do Nadal, como pasamos á seguinte sala?")
window.espirito=t=>{ amosar(t,null); responder(t); };

conectar({
  apiKey:"AIzaSyD6WPMALoBWUPPYAkbT0MXkeUtT6tVT7F0",
  authDomain:"escaperoomprueba.firebaseapp.com",
  projectId:"escaperoomprueba",
  storageBucket:"escaperoomprueba.appspot.com",
  messagingSenderId:"370330539854",
  appId:"1:370330539854:web:0bb275c4e1a4b1fdb8301f"
});
</script>
</body>
</html>
